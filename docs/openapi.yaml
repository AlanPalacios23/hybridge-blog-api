openapi: 3.1.0
info:
  title: Hybridge Blog API
  version: 1.0.0
  description: API REST de blog con autenticación JWT, PostgreSQL y documentación OpenAPI.
  contact:
    name: Alan Palacios
servers:
  - url: /
    description: Servidor actual
tags:
  - name: Sistema
  - name: Autenticación
  - name: Publicaciones
paths:
  /:
    get:
      tags: [Sistema]
      summary: Consultar la información principal de la API
      responses:
        "200":
          description: API en línea
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /api/health:
    get:
      tags: [Sistema]
      summary: Verificar la salud de la API y de PostgreSQL
      responses:
        "200":
          description: Servicio saludable
        "503":
          description: La base de datos no está disponible
  /api/auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
            example:
              name: Alan Palacios
              email: alan@example.com
              password: Segura123
      responses:
        "201":
          description: Cuenta creada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: El correo ya está registrado
  /api/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Sesión iniciada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Credenciales incorrectas
  /api/auth/me:
    get:
      tags: [Autenticación]
      summary: Consultar el perfil autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil del usuario
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/posts:
    get:
      tags: [Publicaciones]
      summary: Listar publicaciones
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Lista paginada de publicaciones
    post:
      tags: [Publicaciones]
      summary: Crear una publicación
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Publicación creada correctamente
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /api/posts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Publicaciones]
      summary: Consultar una publicación
      responses:
        "200":
          description: Publicación encontrada
        "404":
          description: Publicación no encontrada
    patch:
      tags: [Publicaciones]
      summary: Actualizar una publicación propia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostUpdateInput"
      responses:
        "200":
          description: Publicación actualizada
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Publicación no encontrada o sin permisos
    delete:
      tags: [Publicaciones]
      summary: Eliminar una publicación propia
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Publicación eliminada
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Publicación no encontrada o sin permisos
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    PostInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 180
        content:
          type: string
          minLength: 10
          maxLength: 20000
    PostUpdateInput:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 180
        content:
          type: string
          minLength: 10
          maxLength: 20000
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data:
          type: object
          properties:
            user:
              $ref: "#/components/schemas/User"
            token: { type: string }
    SuccessResponse:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    ValidationError:
      description: Los datos enviados no son válidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Token ausente, inválido o expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
